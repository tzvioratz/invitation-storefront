  <text x="198" y="385" font-family="&#39;Frank Ruhl Libre&#39;, serif" font-size="9.5" font-weight="400" font-style="normal" fill="#1F1F1F" text-anchor="middle"><tspan id="heb_date_weekday_prefix" data-field="heb_date_weekday_prefix" data-label="Date Weekday Wording" data-editor-hidden="true">יום שני לפרשת </tspan><tspan id="heb_parsha" data-field="heb_parsha" data-label="Parsha">תצוה</tspan><tspan id="heb_date" data-field="heb_date" data-label="Hebrew Wedding Date">, אור לי״א אדר א׳ תשפ״ד</tspan></text>

  <text x="212" y="404" font-family="&#39;Frank Ruhl Libre&#39;, serif" font-size="9.5" font-weight="400" font-style="normal" fill="#1F1F1F" text-anchor="start"><tspan id="heb_kabulas_punim_prefix" data-field="heb_kabulas_punim_prefix" data-label="Kabulas Punim Wording" data-editor-hidden="true">קבלת פנים בשעה </tspan><tspan id="heb_kabulas_punim" data-field="heb_kabulas_punim" data-label="Kabulas Punim Time">שש</tspan><tspan id="heb_kabulas_punim_suffix" data-field="heb_kabulas_punim_suffix" data-label="Kabulas Punim Time Suffix" data-editor-hidden="true"> בערב</tspan></text>

  <text x="184" y="404" font-family="&#39;Frank Ruhl Libre&#39;, serif" font-size="9.5" font-weight="400" font-style="normal" fill="#1F1F1F" text-anchor="end"><tspan id="heb_chuppah_prefix" data-field="heb_chuppah_prefix" data-label="Chuppah Wording" data-editor-hidden="true">החופה בשעה </tspan><tspan id="heb_chuppah" data-field="heb_chuppah" data-label="Chuppah Time">שבע</tspan></text>

  <text id="heb_simchas_chosson_vkallah" data-field="heb_simchas_chosson_vkallah" data-label="Simchas Chosson V'Kallah Time" x="198" y="423" font-family="&#39;Frank Ruhl Libre&#39;, serif" font-size="9.5" font-weight="400" font-style="normal" fill="#1F1F1F" text-anchor="middle">שמחת חתן וכלה בשעה עשר</text>

  <text id="heb_venue" data-field="heb_venue" data-label="Venue" x="198" y="456" font-family="&#39;Frank Ruhl Libre&#39;, serif" font-size="9.5" font-weight="400" font-style="normal" fill="#1F1F1F" text-anchor="middle">עטרת עלקא</text>

  <text id="heb_city_state" data-field="heb_city_state" data-label="City and State" x="198" y="475" font-family="&#39;Frank Ruhl Libre&#39;, serif" font-size="9.5" font-weight="400" font-style="normal" fill="#1F1F1F" text-anchor="middle">אוויגס מילז, מרילנד</text>

  <text id="heb_chosson_parents" data-field="heb_chosson_parents" data-label="Chosson's Parents" x="198" y="510" font-family="&#39;Frank Ruhl Libre&#39;, serif" font-size="9" font-weight="400" font-style="normal" fill="#1F1F1F" text-anchor="middle">הורי החתן אליהו מנדלבוים ורעיתו</text>

