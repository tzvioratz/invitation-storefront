  <text id="heb_monogram" data-field="heb_monogram" data-label="Monogram" data-editor-hidden="true" x="334" y="80" font-family="&#39;Frank Ruhl Libre&#39;, serif" font-size="37" font-weight="400" font-style="normal" fill="#1F1F1F" text-anchor="start">מ</text>

  <text id="heb_bh" data-field="heb_bh" data-label="Opening Religious Inscription" data-editor-hidden="true" x="334" y="114" font-family="&#39;Frank Ruhl Libre&#39;, serif" font-size="8" font-weight="500" font-style="normal" fill="#1F1F1F" text-anchor="start">בעזהשי״ת</text>

