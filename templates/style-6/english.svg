
<svg xmlns="http://www.w3.org/2000/svg" width="5.5in" height="8.5in" viewBox="0 0 396 612">

<metadata>
  <font-declaration
      data-font-family="Montserrat"
      data-font-provider="google"
      data-font-source="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500&amp;display=swap"
      data-font-weight="400"
      data-font-style="normal" />
  <font-declaration
      data-font-family="Montserrat"
      data-font-provider="google"
      data-font-source="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500&amp;display=swap"
      data-font-weight="500"
      data-font-style="normal" />
</metadata>
<defs>
  <style type="text/css"><![CDATA[
    @import url("https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500&display=swap");
  ]]></style>
</defs>

<rect x="0" y="0" width="396" height="612" fill="#FFFFFF" />

<text x="198" y="85" font-family="Montserrat" font-size="14" font-weight="500" font-style="normal" fill="#231F20" text-anchor="middle" letter-spacing="1"
      data-field="card1_english_initial" data-label="Decorative Initial" data-editor-hidden="true">B</text>
<line x1="179" y1="97" x2="217" y2="97" stroke="#231F20" stroke-width="0.75" />

<text x="198" y="142" font-family="Montserrat" font-size="7.6" font-weight="400" font-style="normal" fill="#231F20" text-anchor="middle" letter-spacing="1.75"
      data-field="card1_english_gratitude" data-label="Opening Religious Wording" data-editor-hidden="true">WITH GRATITUDE TO HASHEM</text>
<text x="198" y="162" font-family="Montserrat" font-size="7.6" font-weight="400" font-style="normal" fill="#231F20" text-anchor="middle" letter-spacing="1.75"
      data-field="card1_english_groom_parents" data-label="Groom's Parents">MR. AND MRS. DOVID STERN</text>
<text x="198" y="182" font-family="Montserrat" font-size="7.6" font-weight="400" font-style="normal" fill="#231F20" text-anchor="middle" letter-spacing="1.75"
      data-field="card1_english_bride_parents" data-label="Bride's Parents">MR. AND MRS. SHMUEL BERGER</text>
<text x="198" y="202" font-family="Montserrat" font-size="7.6" font-weight="400" font-style="normal" fill="#231F20" text-anchor="middle" letter-spacing="1.75"
      data-field="card1_english_invitation_wording" data-label="Invitation Wording" data-editor-hidden="true">REQUEST THE HONOUR OF YOUR PRESENCE</text>
<text x="198" y="222" font-family="Montserrat" font-size="7.6" font-weight="400" font-style="normal" fill="#231F20" text-anchor="middle" letter-spacing="1.75"
      data-field="card1_english_marriage_intro" data-label="Marriage Introduction" data-editor-hidden="true">AT THE MARRIAGE OF THEIR CHILDREN</text>

<text x="198" y="274" font-family="Montserrat" font-size="13.5" font-weight="500" font-style="normal" fill="#231F20" text-anchor="middle" letter-spacing="3.2"
      data-field="card1_english_kallah" data-label="Bride's Name">ROCHEL LEAH</text>
<text x="198" y="299" font-family="Montserrat" font-size="7.4" font-weight="400" font-style="normal" fill="#231F20" text-anchor="middle" letter-spacing="1.8"
      data-field="card1_english_name_connector" data-label="Name Connector" data-editor-hidden="true">AND</text>
<text x="198" y="324" font-family="Montserrat" font-size="13.5" font-weight="500" font-style="normal" fill="#231F20" text-anchor="middle" letter-spacing="3.2"
      data-field="card1_english_chosson" data-label="Groom's Name">ELIYAHU</text>

<text x="198" y="381" font-family="Montserrat" font-size="7.6" font-weight="400" font-style="normal" fill="#231F20" text-anchor="middle" letter-spacing="1.75"
      data-field="card1_english_date" data-label="Wedding Date">WEDNESDAY, THE TENTH OF AUGUST</text>
<text x="198" y="401" font-family="Montserrat" font-size="7.6" font-weight="400" font-style="normal" fill="#231F20" text-anchor="middle" letter-spacing="1.75"
      data-field="card1_english_year" data-label="Wedding Year">TWO THOUSAND TWENTY-FOUR</text>
<text x="198" y="421" font-family="Montserrat" font-size="7.6" font-weight="400" font-style="normal" fill="#231F20" text-anchor="middle" letter-spacing="1.75" xml:space="preserve"><tspan data-field="card1_english_reception_prefix" data-label="Reception Wording" data-editor-hidden="true">RECEPTION AT </tspan><tspan data-field="card1_english_reception_time" data-label="Reception Time">SIX-THIRTY</tspan><tspan data-field="card1_english_reception_suffix" data-label="Reception Time Suffix" data-editor-hidden="true"> IN THE EVENING</tspan></text>
<text x="198" y="441" font-family="Montserrat" font-size="7.6" font-weight="400" font-style="normal" fill="#231F20" text-anchor="middle" letter-spacing="1.75" xml:space="preserve"><tspan data-field="card1_english_chupah_prefix" data-label="Chupah Wording" data-editor-hidden="true">CHUPAH AT </tspan><tspan data-field="card1_english_chupah_time" data-label="Chupah Time">SEVEN-THIRTY</tspan></text>

<text x="198" y="492" font-family="Montserrat" font-size="7.6" font-weight="400" font-style="normal" fill="#231F20" text-anchor="middle" letter-spacing="1.75"
      data-field="card1_english_venue" data-label="Venue">ATERES ELKA</text>
<text x="198" y="512" font-family="Montserrat" font-size="7.6" font-weight="400" font-style="normal" fill="#231F20" text-anchor="middle" letter-spacing="1.75"
      data-field="card1_english_address" data-label="Street Address">2905 WALNUT AVENUE</text>
<text x="198" y="532" font-family="Montserrat" font-size="7.6" font-weight="400" font-style="normal" fill="#231F20" text-anchor="middle" letter-spacing="1.75"
      data-field="card1_english_city" data-label="City and State">OWINGS MILLS, MARYLAND</text>
