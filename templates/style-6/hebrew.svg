
<svg xmlns="http://www.w3.org/2000/svg" width="5.5in" height="8.5in" viewBox="0 0 396 612">

<metadata>
  <font-declaration
      data-font-family="Assistant"
      data-font-provider="google"
      data-font-source="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500&amp;display=swap"
      data-font-weight="400"
      data-font-style="normal" />
  <font-declaration
      data-font-family="Assistant"
      data-font-provider="google"
      data-font-source="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500&amp;display=swap"
      data-font-weight="500"
      data-font-style="normal" />
</metadata>
<defs>
  <style type="text/css"><![CDATA[
    @import url("https://fonts.googleapis.com/css2?family=Assistant:wght@400;500&display=swap");
  ]]></style>
</defs>

<rect x="0" y="0" width="396" height="612" fill="#FFFFFF" />

<text x="198" y="88" font-family="Assistant" font-size="16" font-weight="500" font-style="normal" fill="#231F20" text-anchor="middle"
      data-field="card1_hebrew_initial" data-label="Decorative Hebrew Initial" data-editor-hidden="true">ב</text>
<line x1="179" y1="99" x2="217" y2="99" stroke="#231F20" stroke-width="0.75" />

<text x="198" y="138" font-family="Assistant" font-size="9.5" font-weight="400" font-style="normal" fill="#231F20" text-anchor="middle"
      data-field="card1_hebrew_gratitude" data-label="Opening Religious Wording" data-editor-hidden="true">בעזרת השם יתברך</text>
<text x="198" y="154" font-family="Assistant" font-size="9.5" font-weight="400" font-style="normal" fill="#231F20" text-anchor="middle"
      data-field="card1_hebrew_jerusalem" data-label="Jerusalem Wording" data-editor-hidden="true">נעלה את ירושלים על ראש שמחתנו</text>

<text x="198" y="182" font-family="Assistant" font-size="9.5" font-weight="400" font-style="normal" fill="#231F20" text-anchor="middle"
      data-field="card1_hebrew_praise" data-label="Opening Praise" data-editor-hidden="true">ברוב שבח והודאה להשי"ת</text>
<text x="198" y="198" font-family="Assistant" font-size="9.5" font-weight="400" font-style="normal" fill="#231F20" text-anchor="middle"
      data-field="card1_hebrew_invitation" data-label="Invitation Wording" data-editor-hidden="true">מתכבדים אנו להזמין את קרובינו וידידינו</text>
<text x="198" y="214" font-family="Assistant" font-size="9.5" font-weight="400" font-style="normal" fill="#231F20" text-anchor="middle"
      data-field="card1_hebrew_marriage_intro" data-label="Marriage Introduction" data-editor-hidden="true">להשתתף בשמחת כלולות בנינו היקרים</text>

<text x="198" y="255" font-family="Assistant" font-size="18.5" font-weight="500" font-style="normal" fill="#231F20" text-anchor="middle" xml:space="preserve"><tspan font-size="8.2" font-weight="400" data-field="card1_hebrew_groom_prefix" data-label="Groom Title" data-editor-hidden="true">החתן </tspan><tspan font-size="18.5" font-weight="500" data-field="card1_hebrew_chosson" data-label="Groom's Name">אליהו משה</tspan><tspan font-size="8.2" font-weight="400" data-field="card1_hebrew_groom_suffix" data-label="Groom Suffix" data-editor-hidden="true"> נ"י</tspan></text>
<text x="198" y="273" font-family="Assistant" font-size="8.2" font-weight="400" font-style="normal" fill="#231F20" text-anchor="middle"
      data-field="card1_hebrew_connector" data-label="Marriage Connector" data-editor-hidden="true">עב"ג</text>
<text x="198" y="294" font-family="Assistant" font-size="18.5" font-weight="500" font-style="normal" fill="#231F20" text-anchor="middle" xml:space="preserve"><tspan font-size="8.2" font-weight="400" data-field="card1_hebrew_bride_prefix" data-label="Bride Title" data-editor-hidden="true">הכלה </tspan><tspan font-size="18.5" font-weight="500" data-field="card1_hebrew_kallah" data-label="Bride's Name">רחל לאה</tspan><tspan font-size="8.2" font-weight="400" data-field="card1_hebrew_bride_suffix" data-label="Bride Suffix" data-editor-hidden="true"> תחי'</tspan></text>

<text x="198" y="334" font-family="Assistant" font-size="9.5" font-weight="400" font-style="normal" fill="#231F20" text-anchor="middle"
      data-field="card1_hebrew_good_wishes" data-label="Good Wishes" data-editor-hidden="true">שתתקיים אי"ה למזל טוב בשעה טובה ומוצלחת</text>
<text x="198" y="350" font-family="Assistant" font-size="9.5" font-weight="400" font-style="normal" fill="#231F20" text-anchor="middle"
      data-field="card1_hebrew_date" data-label="Hebrew Wedding Date">ביום שני לפרשת ויקרא, אור לכ"ח אדר תשפ"ג</text>
<text x="198" y="366" font-family="Assistant" font-size="9.5" font-weight="400" font-style="normal" fill="#231F20" text-anchor="middle"
      data-field="card1_hebrew_reception" data-label="Reception Time">קבלת פנים בשעה שש וחצי בערב</text>
<text x="198" y="382" font-family="Assistant" font-size="9.5" font-weight="400" font-style="normal" fill="#231F20" text-anchor="middle"
      data-field="card1_hebrew_chupah" data-label="Chupah Time">החופה בשעה שבע וחצי</text>

<text x="198" y="413" font-family="Assistant" font-size="10.2" font-weight="400" font-style="normal" fill="#231F20" text-anchor="middle"
      data-field="card1_hebrew_venue" data-label="Venue">עטרת עלקא</text>
<text x="198" y="430" font-family="Assistant" font-size="10.2" font-weight="400" font-style="normal" fill="#231F20" text-anchor="middle"
      data-field="card1_hebrew_city" data-label="City and State">אוויגס מילז, מרילנד</text>

<text x="267" y="468" font-family="Assistant" font-size="8.2" font-weight="400" font-style="normal" fill="#231F20" text-anchor="middle"
      data-field="card1_hebrew_groom_parents_label" data-label="Groom's Parents Heading" data-editor-hidden="true">הורי החתן</text>
<text x="267" y="483" font-family="Assistant" font-size="9.2" font-weight="400" font-style="normal" fill="#231F20" text-anchor="middle"
      data-field="card1_hebrew_groom_parents" data-label="Groom's Parents">שמואל וחיה בערגער</text>

<text x="129" y="468" font-family="Assistant" font-size="8.2" font-weight="400" font-style="normal" fill="#231F20" text-anchor="middle"
      data-field="card1_hebrew_bride_parents_label" data-label="Bride's Parents Heading" data-editor-hidden="true">הורי הכלה</text>
<text x="129" y="483" font-family="Assistant" font-size="9.2" font-weight="400" font-style="normal" fill="#231F20" text-anchor="middle"
      data-field="card1_hebrew_bride_parents" data-label="Bride's Parents">דוד וגיטל שטערן</text>

<text x="198" y="512" font-family="Assistant" font-size="8" font-weight="400" font-style="normal" fill="#231F20" text-anchor="middle"
      data-field="card1_hebrew_family_quote" data-label="Family Wording" data-editor-hidden="true">תפארת בנים אבותם</text>

<text x="264" y="527" font-family="Assistant" font-size="7.6" font-weight="400" font-style="normal" fill="#231F20" text-anchor="middle"
      data-field="card1_hebrew_groom_grandparents" data-label="Groom's Grandparents" data-multiline="true"><tspan x="264" y="527">הרב חיים ולאה בערגער</tspan><tspan x="264" y="539">מרת דבורה רייך</tspan></text>

<text x="132" y="527" font-family="Assistant" font-size="7.6" font-weight="400" font-style="normal" fill="#231F20" text-anchor="middle"
      data-field="card1_hebrew_bride_grandparents" data-label="Bride's Grandparents" data-multiline="true"><tspan x="132" y="527">הרב משה וגיטל שטערן</tspan><tspan x="132" y="539">הרב יצחק ושרה פרידמאן</tspan></text>
</svg>
