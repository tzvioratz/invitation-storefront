  <text x="198" y="525" font-family="Frank Ruhl Libre" font-size="15" font-weight="400" font-style="normal" fill="#000000" text-anchor="middle" data-field="card2_cityHebrew" data-label="City and State in Hebrew">אוויגס מילז, מרילנד</text>

