  <rect x="0" y="0" width="396" height="612" fill="#ffffff" id="rect1" />

  <text x="198" y="62" font-family="'Frank Ruhl Libre', serif" font-size="15.5" font-weight="500" font-style="normal" fill="#1a1a1a" text-anchor="middle" id="text1"
