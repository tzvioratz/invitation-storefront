<svg width="5.5in" height="8.5in" viewBox="0 0 396 612" id="svg19" xmlns="http://www.w3.org/2000/svg">
  
    
    
    
  
  <defs id="defs19" />
  
  <rect x="0" y="0" width="396" height="612" fill="#ffffff" id="rect1" />
  <text x="198" y="62" font-family="&#39;Frank Ruhl Libre&#39;, serif" font-size="15.5" font-weight="500" font-style="normal" fill="#1a1a1a" text-anchor="middle" id="text1">בעזהשי"ת</text>
  <text x="198" y="96" font-family="&#39;Frank Ruhl Libre&#39;, serif" font-size="15.5" font-weight="500" font-style="normal" fill="#1a1a1a" text-anchor="middle" id="text2">נעלה את ירושלים על ראש שמחתנו</text>
  <text x="198" y="116" font-family="&#39;Frank Ruhl Libre&#39;, serif" font-size="15.5" font-weight="500" font-style="normal" fill="#1a1a1a" text-anchor="middle" id="text3">קול ששון • וקול שמחה • קול חתן • וקול כלה</text>
  <text x="198" y="150" font-family="&#39;Frank Ruhl Libre&#39;, serif" font-size="15.5" font-weight="500" font-style="normal" fill="#1a1a1a" text-anchor="middle" id="text4">ברוב שבח והודאה להשי"ת</text>
  <text x="198" y="170" font-family="&#39;Frank Ruhl Libre&#39;, serif" font-size="15.5" font-weight="500" font-style="normal" fill="#1a1a1a" text-anchor="middle" id="text5">מתכבדים אנו להזמין את כבודכם</text>
  <text x="198" y="190" font-family="&#39;Frank Ruhl Libre&#39;, serif" font-size="15.5" font-weight="500" font-style="normal" fill="#1a1a1a" text-anchor="middle" id="text6">להשתתף בשמחת כלולות בנינו היקרים</text>
  <text x="198" y="255" font-family="&#39;Frank Ruhl Libre&#39;, serif" font-size="36px" font-weight="700" font-style="normal" fill="#141414" text-anchor="middle" xml:space="preserve" id="text8" style="word-spacing:1.4775px"><tspan font-size="15.5" dy="-3" id="tspan6" style="word-spacing:2px"> החתן </tspan><tspan dy="3" id="tspan7" style="word-spacing:2px">מנחם</tspan><tspan font-size="15.5" dy="-2" id="tspan8" style="word-spacing:5px"> נ"י </tspan></text>
  <text x="198" y="279" font-family="&#39;Frank Ruhl Libre&#39;, serif" font-size="15.5" font-weight="700" font-style="normal" fill="#1a1a1a" text-anchor="middle" id="text9">עב"ג</text>
  <text x="198" y="313" font-family="&#39;Frank Ruhl Libre&#39;, serif" font-size="36" font-weight="700" font-style="normal" fill="#141414" text-anchor="middle" xml:space="preserve" id="text11"><tspan font-size="15.5" dy="-3" id="tspan9">'הכלה </tspan><tspan dy="3" id="tspan10">אלישבע</tspan><tspan font-size="15.5" dy="-2" id="tspan11"> תחי </tspan></text>
  <text x="198" y="362" font-family="&#39;Frank Ruhl Libre&#39;, serif" font-size="15.5" font-weight="500" font-style="normal" fill="#1a1a1a" text-anchor="middle" id="text12">שתת  קיים אי"ה בשעה טובה ומוצלחת</text>
  <text x="198" y="382" font-family="&#39;Frank Ruhl Libre&#39;, serif" font-size="15.5" font-weight="500" font-style="normal" fill="#1a1a1a" text-anchor="middle" id="text13">ביום ראשון לפרשת תצוה, אור לו' אדר תשפ"ד</text>
  <text x="198" y="402" font-family="&#39;Frank Ruhl Libre&#39;, serif" font-size="15.5" font-weight="500" font-style="normal" fill="#1a1a1a" text-anchor="middle" id="text14"><tspan id="tspan13">קבלת פנים בשעה שש בערב</tspan><tspan dx="14" id="tspan14">החופה בשעה שבע</tspan></text>
  <text x="198" y="422" font-family="&#39;Frank Ruhl Libre&#39;, serif" font-size="15.5" font-weight="500" font-style="normal" fill="#1a1a1a" text-anchor="middle" id="text15">שמחת חתן וכלה בשעה עשר</text>
  <text x="198" y="458" font-family="&#39;Frank Ruhl Libre&#39;, serif" font-size="15.5" font-weight="500" font-style="normal" fill="#1a1a1a" text-anchor="middle" id="text16">באולם עטרת אברהם</text>
  <text x="198" y="478" font-family="&#39;Frank Ruhl Libre&#39;, serif" font-size="15.5" font-weight="500" font-style="normal" fill="#1a1a1a" text-anchor="middle" id="text17">ברוקלין, נוא יארק</text>
  <text x="198" y="514" font-family="&#39;Frank Ruhl Libre&#39;, serif" font-size="15.5" font-weight="700" font-style="normal" fill="#1a1a1a" text-anchor="middle" id="text18">הורי החתן חיים רוזנברג ורעיתו</text>
  <text x="198" y="534" font-family="&#39;Frank Ruhl Libre&#39;, serif" font-size="15.5" font-weight="700" font-style="normal" fill="#1a1a1a" text-anchor="middle" id="text19">הורי הכלה שלמה קליין ורעיתו</text>
</svg>