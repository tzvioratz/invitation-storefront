  <text x="198" y="64" font-family="Alex Brush" font-size="22" font-weight="400" font-style="normal" fill="#000000" text-anchor="middle">Rabbi and Mrs. Raphael Gold</text>
  <text x="198" y="92" font-family="Alex Brush" font-size="22" font-weight="400" font-style="normal" fill="#000000" text-anchor="middle">Rabbi and Mrs. Avi Fried</text>
  <text x="198" y="120" font-family="Alex Brush" font-size="22" font-weight="400" font-style="normal" fill="#000000" text-anchor="middle">request the honor of your presence</text>
