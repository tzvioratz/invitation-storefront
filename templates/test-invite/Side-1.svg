<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 850" width="5.5in" height="8.5in">
  <title>Wedding Invitation Template (5.5 x 8.5 in)</title>

  <!-- Page background -->
  <rect x="0" y="0" width="550" height="850" fill="#ffffff"/>

  <!-- ===== Opening block (permanent text) ===== -->
  <text x="275" y="130" text-anchor="middle" font-family="Cinzel, 'Trajan Pro', 'Times New Roman', serif" font-size="15" letter-spacing="1.2" fill="#1a1a1a">WITH GRATITUDE TO HASHEM YISBORACH</text>

  <!-- Kallah's parents -->
  <text data-field="kallahParents" data-label="Kallah's Parents"
        x="275" y="163" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"
        font-family="Cinzel, 'Trajan Pro', 'Times New Roman', serif" font-size="15" letter-spacing="1.2" fill="#1a1a1a">MR. AND MRS. DOVID BRAUN</text>

  <!-- Chosson's parents -->
  <text data-field="chossonParents" data-label="Chosson's Parents"
        x="275" y="196" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"
        font-family="Cinzel, 'Trajan Pro', 'Times New Roman', serif" font-size="15" letter-spacing="1.2" fill="#1a1a1a">RABBI AND MRS. PINCHAS BERGER</text>

  <!-- Permanent request lines -->
  <text x="275" y="229" text-anchor="middle" font-family="Cinzel, 'Trajan Pro', 'Times New Roman', serif" font-size="15" letter-spacing="1.2" fill="#1a1a1a">REQUEST THE HONOUR OF YOUR PRESENCE</text>
  <text x="275" y="262" text-anchor="middle" font-family="Cinzel, 'Trajan Pro', 'Times New Roman', serif" font-size="15" letter-spacing="1.2" fill="#1a1a1a">AT THE MARRIAGE OF THEIR CHILDREN</text>

  <!-- ===== Names (script) ===== -->
  <text data-field="kallah" data-label="Kallah's Name"
        x="262" y="355" text-anchor="end" direction="ltr" unicode-bidi="plaintext"
        font-family="'Pinyon Script', 'Snell Roundhand', 'Brush Script MT', cursive" font-size="72" fill="#1a1a1a">Miri</text>

  <text x="276" y="355" text-anchor="start"
        font-family="'Pinyon Script', 'Snell Roundhand', 'Brush Script MT', cursive" font-size="48" fill="#1a1a1a">and</text>

  <text data-field="chosson" data-label="Chosson's Name"
        x="300" y="434" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"
        font-family="'Pinyon Script', 'Snell Roundhand', 'Brush Script MT', cursive" font-size="72" fill="#1a1a1a">Moishe</text>

  <!-- ===== Date and time ===== -->
  <text data-field="date" data-label="Wedding Date"
        x="275" y="540" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"
        font-family="Cinzel, 'Trajan Pro', 'Times New Roman', serif" font-size="15" letter-spacing="1.2" fill="#1a1a1a">MONDAY, THE TWENTIETH OF MARCH</text>

  <text data-field="time" data-label="Reception Time"
        x="275" y="573" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"
        font-family="Cinzel, 'Trajan Pro', 'Times New Roman', serif" font-size="15" letter-spacing="1.2" fill="#1a1a1a">AT SIX-THIRTY IN THE EVENING</text>

  <text data-field="chupahTime" data-label="Chupah Time"
        x="275" y="606" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"
        font-family="Cinzel, 'Trajan Pro', 'Times New Roman', serif" font-size="15" letter-spacing="1.2" fill="#1a1a1a">CHUPAH AT SEVEN-THIRTY</text>

  <!-- ===== Venue ===== -->
  <text data-field="venue" data-label="Venue Name"
        x="275" y="665" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"
        font-family="Cinzel, 'Trajan Pro', 'Times New Roman', serif" font-size="15" letter-spacing="1.2" fill="#1a1a1a">LAKE TERRACE</text>

  <text data-field="address" data-label="Street Address"
        x="275" y="698" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"
        font-family="Cinzel, 'Trajan Pro', 'Times New Roman', serif" font-size="15" letter-spacing="1.2" fill="#1a1a1a">1690 OAK STREET</text>

  <text data-field="cityState" data-label="City and State"
        x="275" y="731" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"
        font-family="Cinzel, 'Trajan Pro', 'Times New Roman', serif" font-size="15" letter-spacing="1.2" fill="#1a1a1a">LAKEWOOD, NEW JERSEY</text>
</svg>