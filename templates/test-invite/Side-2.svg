<svg xmlns="http://www.w3.org/2000/svg"
     width="5.5in"
     height="8.5in"
     viewBox="0 0 396 612">
  <metadata>
    <font-declaration
        data-font-family="Frank Ruhl Libre"
        data-font-provider="google"
        data-font-source="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400"
        data-font-weight="400"
        data-font-style="normal" />
    <font-declaration
        data-font-family="Frank Ruhl Libre"
        data-font-provider="google"
        data-font-source="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500"
        data-font-weight="500"
        data-font-style="normal" />
  </metadata>

  <!-- Background -->
  <rect x="0" y="0" width="396" height="612" fill="#ffffff"/>

  <g font-family="'Frank Ruhl Libre', serif" fill="#1a1a1a" direction="rtl" unicode-bidi="plaintext" text-anchor="middle">

    <!-- Opening lines -->
    <text x="198" y="74" font-size="13" font-weight="400"
          data-field="card1_heb_opening1" data-label="Opening Line 1" data-editor-hidden="true">בעזרת השם יתברך</text>
    <text x="198" y="94" font-size="13" font-weight="400"
          data-field="card1_heb_opening2" data-label="Opening Line 2" data-editor-hidden="true">נעלה את ירושלים על ראש שמחתנו</text>

    <!-- Invitation wording -->
    <text x="198" y="128" font-size="13" font-weight="400"
          data-field="card1_heb_inviteLine1" data-label="Invitation Line 1" data-editor-hidden="true">ברוך שבח והודאה להשי״ת</text>
    <text x="198" y="148" font-size="13" font-weight="400"
          data-field="card1_heb_inviteLine2" data-label="Invitation Line 2" data-editor-hidden="true">מתכבדים אנו להזמין את קרובינו וידידינו</text>
    <text x="198" y="168" font-size="13" font-weight="400"
          data-field="card1_heb_inviteLine3" data-label="Invitation Line 3" data-editor-hidden="true">להשתתף בשמחת כלולות בננו היקר</text>

    <!-- Groom -->
    <text x="272" y="216" font-size="9" font-weight="400"
          data-field="card1_heb_chossonLabel" data-label="Groom Label" data-editor-hidden="true">החתן</text>
    <text x="200" y="224" font-size="32" font-weight="500"
          data-field="card1_heb_chosson" data-label="Groom's Name">משה נתן</text>
    <text x="128" y="216" font-size="9" font-weight="400"
          data-field="card1_heb_chossonSuffix" data-label="Groom Blessing Suffix" data-editor-hidden="true">ני״ו</text>

    <!-- Connector -->
    <text x="198" y="254" font-size="10" font-weight="400"
          data-field="card1_heb_connector" data-label="Connector" data-editor-hidden="true">עב״ג</text>

    <!-- Bride -->
    <text x="272" y="288" font-size="9" font-weight="400"
          data-field="card1_heb_kallahLabel" data-label="Bride Label" data-editor-hidden="true">הכלה</text>
    <text x="200" y="296" font-size="32" font-weight="500"
          data-field="card1_heb_kallah" data-label="Bride's Name">מירל</text>
    <text x="128" y="288" font-size="9" font-weight="400"
          data-field="card1_heb_kallahSuffix" data-label="Bride Blessing Suffix" data-editor-hidden="true">תחי׳</text>

    <!-- Event details -->
    <text x="198" y="338" font-size="13" font-weight="400"
          data-field="card1_heb_eventIntro" data-label="Event Intro Wording" data-editor-hidden="true">שתתקיים אי״ה למזל טוב בשעה טובה ומוצלחת</text>

    <text x="198" y="358" font-size="13" font-weight="400" xml:space="preserve"><tspan data-field="card1_heb_dayPrefix" data-label="Day Prefix" data-editor-hidden="true">ביום </tspan><tspan data-field="card1_heb_day" data-label="Day of Week">שני</tspan><tspan data-field="card1_heb_parshaPrefix" data-label="Parsha Prefix" data-editor-hidden="true"> לפרשת </tspan><tspan data-field="card1_heb_parsha" data-label="Parsha">ויקרא</tspan><tspan data-field="card1_heb_datePrefix" data-label="Date Prefix" data-editor-hidden="true">, אור ל</tspan><tspan data-field="card1_heb_date" data-label="Hebrew Date">כ״ח אדר תשפ״ו</tspan></text>

    <text x="198" y="378" font-size="13" font-weight="400" xml:space="preserve"><tspan data-field="card1_heb_receptionPrefix" data-label="Reception Prefix" data-editor-hidden="true">קבלת פנים בשעה </tspan><tspan data-field="card1_heb_receptionTime" data-label="Reception Time">שש וחצי</tspan><tspan data-field="card1_heb_receptionSuffix" data-label="Reception Suffix" data-editor-hidden="true"> בערב</tspan></text>

    <text x="198" y="398" font-size="13" font-weight="400" xml:space="preserve"><tspan data-field="card1_heb_chuppahPrefix" data-label="Chuppah Prefix" data-editor-hidden="true">חופה בשעה </tspan><tspan data-field="card1_heb_chuppahTime" data-label="Chuppah Time">שבע וחצי</tspan></text>

    <!-- Venue -->
    <text x="198" y="436" font-size="13" font-weight="400" xml:space="preserve"><tspan data-field="card1_heb_venuePrefix" data-label="Venue Prefix" data-editor-hidden="true">באולם </tspan><tspan data-field="card1_heb_venue" data-label="Venue Name">ליק טערעס</tspan></text>
    <text x="198" y="456" font-size="13" font-weight="400"
          data-field="card1_heb_address" data-label="Venue Address">ליקווד, נוא דזערזי</text>

    <!-- Parents: groom's side (right) -->
    <text x="290" y="494" font-size="10" font-weight="400"
          data-field="card1_heb_chossonParentsLabel" data-label="Groom's Parents Label" data-editor-hidden="true">הורי החתן</text>
    <text x="290" y="512" font-size="12" font-weight="500"
          data-field="card1_heb_chossonParents" data-label="Groom's Parents">פנחס וחיה בערגער</text>

    <!-- Parents: bride's side (left) -->
    <text x="106" y="494" font-size="10" font-weight="400"
          data-field="card1_heb_kallahParentsLabel" data-label="Bride's Parents Label" data-editor-hidden="true">הורי הכלה</text>
    <text x="106" y="512" font-size="12" font-weight="500"
          data-field="card1_heb_kallahParents" data-label="Bride's Parents">דוד וגיטל בראון</text>

    <!-- Tiferes banim -->
    <text x="198" y="540" font-size="10" font-weight="400"
          data-field="card1_heb_tiferes" data-label="Tiferes Banim Wording" data-editor-hidden="true">תפארת בנים אבותם</text>

    <!-- Grandparents: groom's side (right) -->
    <text x="285" y="560" font-size="10" font-weight="500"
          data-field="card1_heb_chossonGrandparents" data-label="Groom's Grandparents" data-multiline="true"><tspan x="285" dy="0">הרב חיים מנחם וחוה בערגער</tspan><tspan x="285" dy="17">מרת יהודית רייך</tspan></text>

    <!-- Grandparents: bride's side (left) -->
    <text x="118" y="560" font-size="10" font-weight="500"
          data-field="card1_heb_kallahGrandparents" data-label="Bride's Grandparents" data-multiline="true"><tspan x="118" dy="0">הרב משה ולאה בראון</tspan><tspan x="118" dy="17">הרב יצחק מאיר ושרה פרידמאן</tspan></text>
  </g>
</svg>