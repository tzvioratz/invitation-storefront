  <rect x="0" y="0" width="396" height="612" fill="#FFFFFF" />

  <!-- Top Blessing Couplet -->
  <text id="heb_blessing" data-field="heb_blessing" data-label="Opening Blessing" data-editor-hidden="true" x="198" y="84" font-family="Frank Ruhl Libre" font-size="11" font-weight="400" font-style="normal" fill="#1A1A1A" text-anchor="middle" direction="rtl" unicode-bidi="embed">בעזרת השם יתברך</text>

  <text id="heb_jerusalem_wording" data-field="heb_jerusalem_wording" data-label="Jerusalem Wording" data-editor-hidden="true" x="198" y="101" font-family="Frank Ruhl Libre" font-size="11" font-weight="400" font-style="normal" fill="#1A1A1A" text-anchor="middle" direction="rtl" unicode-bidi="embed">נעלה את ירושלים על ראש שמחתנו</text>

  <!-- Invitation Opening Block -->
  <text id="heb_invitation_thanks" data-field="heb_invitation_thanks" data-label="Opening Thanksgiving" data-editor-hidden="true" x="198" y="128" font-family="Frank Ruhl Libre" font-size="11" font-weight="400" font-style="normal" fill="#1A1A1A" text-anchor="middle" direction="rtl" unicode-bidi="embed">ברוב שבח והודאה להשי"ת</text>

  <text id="heb_invitation_request" data-field="heb_invitation_request" data-label="Invitation Wording" data-editor-hidden="true" x="198" y="145" font-family="Frank Ruhl Libre" font-size="11" font-weight="400" font-style="normal" fill="#1A1A1A" text-anchor="middle" direction="rtl" unicode-bidi="embed">מתכבדים אנו להזמין את קרובינו וידידינו</text>

  <text id="heb_invitation_intro" data-field="heb_invitation_intro" data-label="Marriage Introduction" data-editor-hidden="true" x="198" y="162" font-family="Frank Ruhl Libre" font-size="11" font-weight="400" font-style="normal" fill="#1A1A1A" text-anchor="middle" direction="rtl" unicode-bidi="embed">להשתתף בשמחת כלולות בנינו היקרים</text>

  <!-- Groom & Bride Block -->
  <text x="198" y="210" text-anchor="middle" direction="rtl" unicode-bidi="embed" fill="#1A1A1A" xml:space="preserve"><tspan id="heb_chosson_honorific" data-field="heb_chosson_honorific" data-label="Chosson's Hebrew Honorific" data-editor-hidden="true" font-family="Frank Ruhl Libre" font-size="9.5" font-weight="400" font-style="normal">החתן </tspan><tspan id="heb_chosson" data-field="heb_chosson" data-label="Chosson's Name" data-center="true" font-family="Suez One" font-size="22" font-weight="400" font-style="normal">משה נתן</tspan><tspan id="heb_chosson_suffix" data-field="heb_chosson_suffix" data-label="Chosson's Name Suffix" data-editor-hidden="true" font-family="Frank Ruhl Libre" font-size="9.5" font-weight="400" font-style="normal"> נ"י</tspan></text>

  <text id="heb_couple_connector" data-field="heb_couple_connector" data-label="Couple Connector" data-editor-hidden="true" x="198" y="230" font-family="Frank Ruhl Libre" font-size="9" font-weight="400" font-style="normal" fill="#1A1A1A" text-anchor="middle" direction="rtl" unicode-bidi="embed">עב"ג</text>

  <text x="198" y="259" text-anchor="middle" direction="rtl" unicode-bidi="embed" fill="#1A1A1A" xml:space="preserve"><tspan id="heb_kallah_honorific" data-field="heb_kallah_honorific" data-label="Kallah's Hebrew Honorific" data-editor-hidden="true" font-family="Frank Ruhl Libre" font-size="9.5" font-weight="400" font-style="normal">הכלה </tspan><tspan id="heb_kallah" data-field="heb_kallah" data-label="Kallah's Name" data-center="true" font-family="Suez One" font-size="22" font-weight="400" font-style="normal">מירל</tspan><tspan id="heb_kallah_suffix" data-field="heb_kallah_suffix" data-label="Kallah's Name Suffix" data-editor-hidden="true" font-family="Frank Ruhl Libre" font-size="9.5" font-weight="400" font-style="normal"> תחי'</tspan></text>

  <!-- Date & Time Block -->
  <text id="heb_event_intro" data-field="heb_event_intro" data-label="Event Introduction" data-editor-hidden="true" x="198" y="298" font-family="Frank Ruhl Libre" font-size="11" font-weight="400" font-style="normal" fill="#1A1A1A" text-anchor="middle" direction="rtl" unicode-bidi="embed">שתתקיים אי"ה למזל טוב בשעה טובה ומוצלחת</text>

  <text x="198" y="315" font-family="Frank Ruhl Libre" font-size="11" font-weight="400" font-style="normal" fill="#1A1A1A" text-anchor="middle" direction="rtl" unicode-bidi="embed" xml:space="preserve"><tspan id="heb_date_prefix" data-field="heb_date_prefix" data-label="Hebrew Date Prefix" data-editor-hidden="true">ביום </tspan><tspan id="heb_date_day" data-field="heb_date_day" data-label="Hebrew Weekday" data-autofill="day-he">שני</tspan><tspan id="heb_date_parsha_prefix" data-field="heb_date_parsha_prefix" data-label="Parsha Prefix" data-editor-hidden="true"> לפרשת </tspan><tspan id="heb_parsha" data-field="heb_parsha" data-label="Parsha" data-autofill="parsha-he">ויקרא</tspan><tspan id="heb_date_hdate_prefix" data-field="heb_date_hdate_prefix" data-label="Hebrew Date Connector" data-editor-hidden="true">, אור ל</tspan><tspan id="heb_date" data-field="heb_date" data-label="Hebrew Date" data-autofill="hdate-he">כ"ח אדר תשפ"ד</tspan></text>

  <text x="198" y="332" font-family="Frank Ruhl Libre" font-size="11" font-weight="400" font-style="normal" fill="#1A1A1A" text-anchor="middle" direction="rtl" unicode-bidi="embed" xml:space="preserve"><tspan id="heb_kabulas_punim_prefix" data-field="heb_kabulas_punim_prefix" data-label="Kabulas Punim Prefix" data-editor-hidden="true">קבלת פנים בשעה </tspan><tspan id="heb_kabulas_punim" data-field="heb_kabulas_punim" data-label="Kabulas Punim Time" data-autofill="kabalas-he">שש וחצי</tspan><tspan id="heb_kabulas_punim_suffix" data-field="heb_kabulas_punim_suffix" data-label="Kabulas Punim Suffix" data-editor-hidden="true"> בערב</tspan></text>

  <text x="198" y="349" font-family="Frank Ruhl Libre" font-size="11" font-weight="400" font-style="normal" fill="#1A1A1A" text-anchor="middle" direction="rtl" unicode-bidi="embed" xml:space="preserve"><tspan id="heb_chuppah_prefix" data-field="heb_chuppah_prefix" data-label="Chuppah Prefix" data-editor-hidden="true">החופה בשעה </tspan><tspan id="heb_chuppah" data-field="heb_chuppah" data-label="Chuppah Time" data-autofill="chuppa-he">שבע וחצי</tspan></text>

  <!-- Venue & Location Block -->
  <text id="heb_venue" data-field="heb_venue" data-label="Venue" x="198" y="376" font-family="Frank Ruhl Libre" font-size="11" font-weight="400" font-style="normal" fill="#1A1A1A" text-anchor="middle" direction="rtl" unicode-bidi="embed">עטרת עלקא</text>

  <text id="heb_city_state" data-field="heb_city_state" data-label="City and State" x="198" y="393" font-family="Frank Ruhl Libre" font-size="11" font-weight="400" font-style="normal" fill="#1A1A1A" text-anchor="middle" direction="rtl" unicode-bidi="embed">אוויגס מילז, מרילנד</text>

  <!-- Parents Section (Two Columns) -->
  <text id="heb_chosson_parents_heading" data-field="heb_chosson_parents_heading" data-label="Chosson's Parents Heading" data-editor-hidden="true" x="276" y="423" font-family="Frank Ruhl Libre" font-size="9.5" font-weight="400" font-style="normal" fill="#1A1A1A" text-anchor="middle" direction="rtl" unicode-bidi="embed">הורי החתן</text>

  <text id="heb_chosson_parents" data-field="heb_chosson_parents" data-label="Chosson's Parents" x="276" y="439" font-family="Frank Ruhl Libre" font-size="10.5" font-weight="500" font-style="normal" fill="#1A1A1A" text-anchor="middle" direction="rtl" unicode-bidi="embed">פנחס וחיה בערגער</text>

  <text id="heb_kallah_parents_heading" data-field="heb_kallah_parents_heading" data-label="Kallah's Parents Heading" data-editor-hidden="true" x="120" y="423" font-family="Frank Ruhl Libre" font-size="9.5" font-weight="400" font-style="normal" fill="#1A1A1A" text-anchor="middle" direction="rtl" unicode-bidi="embed">הורי הכלה</text>

  <text id="heb_kallah_parents" data-field="heb_kallah_parents" data-label="Kallah's Parents" x="120" y="439" font-family="Frank Ruhl Libre" font-size="10.5" font-weight="500" font-style="normal" fill="#1A1A1A" text-anchor="middle" direction="rtl" unicode-bidi="embed">דוד וגיטל בראון</text>

  <!-- Grandparents Section -->
  <text id="heb_grandparents_heading" data-field="heb_grandparents_heading" data-label="Grandparents Heading" data-editor-hidden="true" x="198" y="468" font-family="Frank Ruhl Libre" font-size="9.5" font-weight="400" font-style="normal" fill="#1A1A1A" text-anchor="middle" direction="rtl" unicode-bidi="embed">תפארת בנים אבותם</text>

  <text id="heb_chosson_grandparents" data-field="heb_chosson_grandparents" data-label="Chosson's Grandparents" data-multiline="true" x="276" y="485" font-family="Frank Ruhl Libre" font-size="10" font-weight="500" font-style="normal" fill="#1A1A1A" text-anchor="middle" direction="rtl" unicode-bidi="embed">
    <tspan x="276" dy="0">הרב חיים מנחם וחוה בערגער</tspan>
    <tspan x="276" dy="15">מרת יהודית רייך</tspan>
  </text>

  <text id="heb_kallah_grandparents" data-field="heb_kallah_grandparents" data-label="Kallah's Grandparents" data-multiline="true" x="120" y="485" font-family="Frank Ruhl Libre" font-size="10" font-weight="500" font-style="normal" fill="#1A1A1A" text-anchor="middle" direction="rtl" unicode-bidi="embed">
    <tspan x="120" dy="0">הרב משה ולאה בראון</tspan>
    <tspan x="120" dy="15">הרב יצחק מאיר ושרה פרידמאן</tspan>
  </text>
</svg>
