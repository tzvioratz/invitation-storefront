<text x="198" y="232" font-family="Montserrat" font-size="8.2" font-weight="500" font-style="normal" letter-spacing="1.4" fill="#222222" text-anchor="middle"
      data-field="card2_english_marriage_intro" data-label="Marriage Introduction" data-editor-hidden="true">AT THE MARRIAGE OF THEIR CHILDREN</text>

<text x="198" y="294" font-family="Alex Brush" font-size="44" font-weight="400" font-style="normal" fill="#1E1E1E" text-anchor="middle"
