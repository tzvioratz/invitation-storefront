<text x="198" y="444" font-family="Montserrat" font-size="8.2" font-weight="500" font-style="normal" letter-spacing="1.4" fill="#222222" text-anchor="middle" xml:space="preserve"><tspan data-field="card2_english_reception_prefix" data-label="Reception Wording" data-editor-hidden="true">KABOLAS PONIM AT </tspan><tspan data-field="card2_english_reception_time" data-label="Reception Time">SIX-THIRTY</tspan></text>
<text x="198" y="462" font-family="Montserrat" font-size="8.2" font-weight="500" font-style="normal" letter-spacing="1.4" fill="#222222" text-anchor="middle" xml:space="preserve"><tspan data-field="card2_english_chupah_prefix" data-label="Chupah Wording" data-editor-hidden="true">CHUPAH AT </tspan><tspan data-field="card2_english_chupah_time" data-label="Chupah Time">SEVEN-THIRTY</tspan></text>

<text x="198" y="502" font-family="Montserrat" font-size="8.4" font-weight="600" font-style="normal" letter-spacing="1.5" fill="#1E1E1E" text-anchor="middle"
