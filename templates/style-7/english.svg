<text x="198" y="520" font-family="Montserrat" font-size="8.2" font-weight="500" font-style="normal" letter-spacing="1.4" fill="#222222" text-anchor="middle"
      data-field="card2_english_address" data-label="Street Address">2905 WALNUT AVENUE</text>
<text x="198" y="538" font-family="Montserrat" font-size="8.2" font-weight="500" font-style="normal" letter-spacing="1.4" fill="#222222" text-anchor="middle"
