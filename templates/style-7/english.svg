    @import url("https://fonts.googleapis.com/css2?family=Alex+Brush&display=swap");
    @import url("https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap");
  ]]></style>
</defs>

<rect x="0" y="0" width="396" height="612" fill="#FFFFFF" />

<text x="177" y="84" font-family="Alex Brush" font-size="38" font-weight="400" font-style="normal" fill="#1E1E1E" text-anchor="middle"
      data-field="card2_english_initial_b" data-label="Decorative Initial B" data-editor-hidden="true">B</text>
<text x="198" y="106" font-family="Alex Brush" font-size="58" font-weight="400" font-style="normal" fill="#1E1E1E" text-anchor="middle"
      data-field="card2_english_initial_f" data-label="Decorative Initial F" data-editor-hidden="true">F</text>
<text x="220" y="114" font-family="Alex Brush" font-size="38" font-weight="400" font-style="normal" fill="#1E1E1E" text-anchor="middle"
      data-field="card2_english_initial_a" data-label="Decorative Initial A" data-editor-hidden="true">A</text>

<text x="198" y="160" font-family="Montserrat" font-size="8.2" font-weight="500" font-style="normal" letter-spacing="1.4" fill="#222222" text-anchor="middle"
      data-field="card2_english_gratitude" data-label="Opening Religious Wording" data-editor-hidden="true">WITH GRATITUDE TO HASHEM YISBORACH</text>
<text x="198" y="178" font-family="Montserrat" font-size="8.2" font-weight="500" font-style="normal" letter-spacing="1.4" fill="#222222" text-anchor="middle"
      data-field="card2_english_groom_parents" data-label="Groom's Parents">RABBI AND MRS. AARON ROSENBAUM</text>
<text x="198" y="196" font-family="Montserrat" font-size="8.2" font-weight="500" font-style="normal" letter-spacing="1.4" fill="#222222" text-anchor="middle"
