<text x="198" y="324" font-family="Alex Brush" font-size="22" font-weight="400" font-style="normal" fill="#1E1E1E" text-anchor="middle"
      data-field="card2_english_name_connector" data-label="Name Connector" data-editor-hidden="true">&amp;</text>
<text x="198" y="362" font-family="Alex Brush" font-size="44" font-weight="400" font-style="normal" fill="#1E1E1E" text-anchor="middle"
